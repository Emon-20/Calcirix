<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridMath - Professional Logic Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>GRID<span class="highlight">MATH</span></h1>
            <p class="subtitle">Math Sudoku & KenKen Hybrid Challenge</p>
        </header>

        <div class="controls-panel">
            <button id="new-game-btn" class="btn">New Game</button>
            <button id="check-btn" class="btn btn-secondary">Verify Solution</button>
        </div>

        <div class="board-wrapper">
            <!-- 4x4 Grid Board -->
            <div id="grid-board" class="grid-4x4">
                <!-- Cells will be dynamically generated by JS -->
            </div>
        </div>

        <div class="numpad">
            <button class="num-btn" data-val="1">1</button>
            <button class="num-btn" data-val="2">2</button>
            <button class="num-btn" data-val="3">3</button>
            <button class="num-btn" data-val="4">4</button>
            <button class="num-btn clear-btn" data-val="">Clear</button>
        </div>

        <div id="message-box" class="message-box">Select a cell and pick a number to play.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
